name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Sync static export to root for GitHub Pages
        run: |
          rm -rf _next images index.html 404.html index.txt .nojekyll
          cp -r out/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html 404.html index.txt _next images Mahdi_Hasan_Resume.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore(pages): update static export for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
